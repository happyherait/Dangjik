name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: dangjik_admin
          APP_USER: dangjik
          APP_USER_PASSWORD: dangjik
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 5s
          --health-timeout 5s
          --health-retries 60
    env:
      DANGJIK_DB_URL: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -f backend/pom.xml verify | tee mvn.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: |
          grep -h -o -E "(ORA-[0-9]+[^\"]{0,200}|Caused by: .{0,300})" backend/*/target/*-reports/*.txt 2>/dev/null | sort -u | head -10 | while IFS= read -r line; do echo "::error title=cause::${line}"; done
          grep -E "^\[ERROR\]" mvn.log | head -40 | while IFS= read -r line; do echo "::error title=maven::${line}"; done
          for f in $(grep -l -E "FAILURE|ERROR" backend/*/target/*-reports/*.txt 2>/dev/null); do
            body=$(head -c 3000 "$f" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=$(basename "$f")::${body}"
          done

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mall:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/mall/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
